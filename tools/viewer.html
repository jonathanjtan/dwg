<!doctype html>
<html><head><meta charset="utf-8"><title>Model viewer</title>
<style>html,body{margin:0;height:100%;background:#9ab}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RigObject, poseFrom } from '../src/core/rig.js';
import { gundamDef, zakuDef, charDef, commanderDef } from '../src/models/suits.js';
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aaabb);
const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100); cam.position.set(0, 2, 9);
const oc = new OrbitControls(cam, r.domElement); oc.target.set(0, 1.4, 0); oc.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 8, 6); sun.castShadow = true; scene.add(sun);
const g = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({color:0x777777})); g.rotation.x=-Math.PI/2; g.receiveShadow=true; scene.add(g);
const q = new URLSearchParams(location.search);
const pose = poseFrom(JSON.parse(q.get('pose') || '{}'));
const defs = [gundamDef(), zakuDef(), commanderDef(), charDef()];
defs.forEach((d, i) => { const rig = new RigObject(d); rig.applyPose(pose); rig.root.position.x = (i - 1.5) * 3; rig.root.rotation.y = +(q.get('yaw') || 0); scene.add(rig.root); });
window.cam = cam; window.oc = oc;
(function loop(){ requestAnimationFrame(loop); r.render(scene, cam); })();
</script></body></html>
